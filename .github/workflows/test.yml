name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    # 24.04, not ubuntu-latest: setup-python has no Python 3.9 for Ubuntu 26.04
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    # the autocomplete tests skip a shell that is missing, unless MSSH_REQUIRE_SHELLS names it
    env:
      MSSH_REQUIRE_SHELLS: bash,zsh,fish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zsh fish bash-completion
      # The runners leave zsh's function directories writable by others: compinit (Ubuntu's /etc/zsh/zshrc
      # runs it) would stop to ask about them and take a test's first key as the answer. compaudit lists
      # them, and is run again to fail here should any stay.
      - run: |
          insecure=$(zsh -c 'autoload -Uz compaudit && compaudit' | grep '^/' || true)
          [ -z "$insecure" ] || sudo chmod g-w,o-w $insecure
          zsh -c 'autoload -Uz compaudit && compaudit'
      - run: python -m pip install "pytest<9"
      - run: python -m pytest -q
  # setup-python no longer ships 3.6, the oldest Python multiSSH3 supports: it runs in a container
  pytest-py36:
    runs-on: ubuntu-24.04
    # by digest: the python:3.6 tag gets no updates, and a digest cannot be moved
    container: python:3.6@sha256:f8652afaf88c25f0d22354d547d892591067aa4026a7fa9a6819df9f300af6fc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install "pytest<7.1"
      - run: python -m pytest -q -p no:cacheprovider
  # CentOS 7's final packages (bash 4.2, zsh 5.0.2) with ble.sh, the oldest shells mssh's completion supports. By the local
  # matrix's own script: the image built, then the autocomplete tests in it, as nobody, capped, all shells required
  complete-centos7:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exit 3 is a test that failed and passed on the script's rerun: the job stays green and names each one in a warning. Exit 1
      # (a failure on the rerun too, or a run that died) stays red.
      - run: |
          code=0
          tests/shells/run_matrix.sh centos7 > "$RUNNER_TEMP/matrix.log" 2>&1 || code=$?
          cat "$RUNNER_TEMP/matrix.log"
          if [ "$code" -eq 3 ]; then
            sed -n 's/^RERUN //p' "$RUNNER_TEMP/matrix.log" | sed 's/%/%25/g' | while IFS= read -r test; do
              echo "::warning title=Passed only on the rerun::$test"
            done
            code=0
          fi
          exit "$code"
