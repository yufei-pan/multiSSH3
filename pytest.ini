[pytest]
testpaths = tests
pythonpath = .
markers =
    live_ssh: exercises real SSH when available
    live_tui: exercises real curses/tty when available
# our modules must not lean on deprecated APIs: the newest Python (the matrix's current image) turns them into errors
filterwarnings =
    error::DeprecationWarning:mssh_complete
    error::DeprecationWarning:multiSSH3
